name: Build_imm_高通_8916_73

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean


env:
  ALL_DEVICES: "wf2-73 (Linux 7.3-rc5)"
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
       contents: write
       
    strategy:
      fail-fast: false
      matrix:
        device:
          - wf2-73
    steps:
   
    - name: Checkout
      uses: actions/checkout@main
      
    - name: 记录当前编译型号
      run: |
        echo "CONFIG_FILE=config/${{ matrix.device }}.config" >> $GITHUB_ENV


    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update && sudo -E apt-get -y install --no-install-recommends $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: Cache mkbootimg deb
      uses: actions/cache@v5
      with:
        path: downloads/mkbootimg_34.0.5-12build1_all.deb
        key: mkbootimg-34.0.5-12build1
        restore-keys: |
          mkbootimg-

    - name: mkbootimg build
      run: |
        mkdir -p downloads
        cd downloads

        if [ ! -f mkbootimg_34.0.5-12build1_all.deb ]; then
          echo "📥 mkbootimg deb not cached, downloading..."
          wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        else
          echo "✅ mkbootimg deb restored from cache"
        fi

        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || true
        sudo apt-get install -f -y

        mkbootimg --help || true

        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT


        
    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode



    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "===== 源码最近更新 (最后 10 条) ====="
        git -C /mnt/openwrt log -10 --oneline --no-merges

    - name: Load custom DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        
     
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        
        echo "📌 Local packages feed:"
        git -C feeds/packages log -1 --format="%H %ci %s"

        echo "📌 Actual remote of feeds/packages:"
        git -C feeds/packages remote get-url origin

        echo "📌 Remote HEAD actually used:"
        git -C feeds/packages ls-remote HEAD || true

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a -f
        
    - name: remove warning
      run: |
        chmod 755 $GITHUB_WORKSPACE/scripts/diy-part.sh
        $GITHUB_WORKSPACE/scripts/diy-part.sh

    - name: Load custom DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        
    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
      
    - name: make defconfig
      run: |
        cd openwrt
        make defconfig V=s

    - name: 确认内核版本(必须 7.3-rc5)
      run: |
        cd openwrt
        echo "===== .config 内核选择 ====="
        grep -E "^(CONFIG_LINUX_|CONFIG_TESTING_KERNEL)" .config || echo "(无)"
        echo "===== target Makefile 内核相关行 ====="
        grep -nE "FEATURES|KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER" target/linux/msm89xx/Makefile || true
        echo "===== generic/kernel-7.3 ====="
        cat target/linux/generic/kernel-7.3 2>/dev/null || echo "❌ 缺少 target/linux/generic/kernel-7.3"
        echo "===== 7.3 所需文件 ====="
        ls -l target/linux/generic/config-7.3 target/linux/msm89xx/config-7.3 2>/dev/null || true
        ls target/linux/msm89xx/patches-7.3/ 2>/dev/null || true
        echo "===== 实际解析出的内核版本 ====="
        grep -m1 -E "^Linux-Version:" tmp/.targetinfo 2>/dev/null || echo "(tmp/.targetinfo 未生成)"

        # ATM：7.3 删了 UAPI 头 include/uapi/linux/atmsvc.h，linux-atm 会用
        # -I$(LINUX_DIR)/user_headers/include 去要它。diy-part1.sh 第 5b 步
        # 会补一个 compat 头 + -I，这里确认它确实落盘了，免得又炸在同一个地方。
        echo "===== ATM 兼容头（linux/atmsvc.h）====="
        grep -E "^CONFIG_PACKAGE_(linux-atm|ppp-mod-pppoa|br2684ctl)=" .config \
          || echo "(ATM 相关包均未选中，但 linux-atm 仍可能作为构建依赖被拉进来)"
        ls -l package/network/utils/linux-atm/compat/linux/atmsvc.h 2>/dev/null \
          || echo "::warning::没有 compat/linux/atmsvc.h，若 linux-atm 被编到就会 fatal error"
        grep -n "linux-atm/compat" package/network/utils/linux-atm/Makefile 2>/dev/null || true

        # 硬校验：不满足就直接红掉，绝不静默退化成 6.18
        if ! grep -q "^CONFIG_TESTING_KERNEL=y" .config; then
          echo "::error::.config 没有 CONFIG_TESTING_KERNEL=y —— defconfig 把它丢了（HAS_TESTING_KERNEL 未被 select），本次会退化成 6.18"
          exit 1
        fi
        if ! grep -q "^CONFIG_LINUX_7_3=y" .config; then
          echo "::error::.config 没有 CONFIG_LINUX_7_3=y —— 本次不会是 7.3 内核"
          exit 1
        fi
        if grep -q "^CONFIG_LINUX_6_18=y" .config; then
          echo "::error::.config 仍选中 CONFIG_LINUX_6_18=y（与 7.3 互斥），请检查 target Makefile"
          exit 1
        fi
        if ! grep -q "^Linux-Version: 7.3-rc5" tmp/.targetinfo 2>/dev/null; then
          echo "::warning::tmp/.targetinfo 未解析到 7.3-rc5，请核对上面输出"
        fi
        echo "✅ 已确认：本次编译目标内核 = Linux 7.3-rc5"

    - name: 核对关键插件是否被 defconfig 丢弃
      run: |
        cd openwrt
        # defconfig 会把 feeds 里找不到的包静默删掉，构建照样"成功"但插件没了。
        # 这里只告警不中断，方便在日志里直接看出缺了什么。
        for p in luci-app-homeproxy luci-app-mosdns luci-app-upnp luci-app-cpu-perf \
                 luci-app-turboacc DbusSmsForwardCPlus \
                 sqm-scripts kmod-sched-cake kmod-ifb; do
          if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
            echo "✅ ${p}"
          else
            echo "::warning::${p} 未编入 —— defconfig 已丢弃（feeds 中找不到该包）"
          fi
        done
        echo "----- docker 应已移除 -----"
        grep -E "^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|luci-app-docker)" .config \
          | grep -v "is not set" && echo "::warning::docker 相关包仍被选中" || echo "✅ 无 docker"

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: /mnt/openwrt/.ccache
        key: ccache-msm8916-73-${{ github.run_id }}
        restore-keys: |
          ccache-msm8916-73-

    - name: Setup ccache
      run: |
       mkdir -p /mnt/openwrt/.ccache
       export CCACHE_DIR=/mnt/openwrt/.ccache
       export CCACHE_BASEDIR=/mnt/openwrt
       export CCACHE_NOHASHDIR=true
       echo "CCACHE_DIR=/mnt/openwrt/.ccache" >> "$GITHUB_ENV"
       echo "CCACHE_BASEDIR=/mnt/openwrt" >> "$GITHUB_ENV"
       echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
       ccache -M 10G
       ccache -o compression=true
       ccache -o compression_level=1
       ccache -o inode_cache=false
       ccache -o compiler_check=content
       ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,time_macros,pch_defines
       ccache -p | grep -E "max_size|cache_dir"
 
             
    - name: 查看 openwrt 目录
      run: ls -la openwrt/
      
           ls -l .config
      
           ls -la openwrt/.config

 
    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true
       
    - name: Cache dl
      id: cache-dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-immortalwrt-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          dl-${{ runner.os }}-immortalwrt-
          dl-${{ runner.os }}-c1c7610cf12d51c4330c53e338ebd7f883d32b71
          key: dl-${{ runner.os }}-${{ steps.srcver.outputs.sha }}

    - name: Download package
      run: |
        cd openwrt
        if [ "${{ steps.cache-dl.outputs.cache-hit }}" = "true" ]; then echo "cache hit"; else echo "cache miss"; fi

        # 不要把 make 的输出吞进变量：失败时什么都看不到。改成 tee 出来，失败再打印尾部。
        set +e
        make download -j$(nproc) -k V=s 2>&1 | tee download.log
        DL_EXIT=${PIPESTATUS[0]}
        set -e

        if [ $DL_EXIT -ne 0 ]; then
          echo "::group::❌ make download 失败（退出码 $DL_EXIT）"
          tail -n 200 download.log
          echo "----- 错误关键字 -----"
          grep -iE "Cannot find appropriate hash|Hash|checksum|ERROR|error:|No such file|failed|giving up" download.log | tail -n 60
          echo "::endgroup::"
          echo "----- 内核源码包 -----"
          ls -l dl/linux-7.3-rc5.tar.gz 2>/dev/null || echo "⚠️ dl/ 下没有 linux-7.3-rc5.tar.gz"
          exit $DL_EXIT
        fi

        echo "----- 下载告警/错误 -----"
        grep -iE "Hash verification failed|checksum mismatch|ERROR" download.log || true
        echo "----- 内核源码包 -----"
        ls -l dl/linux-7.3-rc5.tar.gz || echo "⚠️ dl/ 下没有 linux-7.3-rc5.tar.gz"
      shell: bash
    
    - name: make -j$(nproc)
      id: compile
      run: |
        cd openwrt
        
        echo "===== ccache BEFORE ====="
        ccache --show-stats
        
        echo -e "$(nproc) thread compile"

        set +e
        make -j$(nproc) -k 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        set -e

        if [ $BUILD_EXIT -ne 0 ]; then
          echo "::group::❌ 并行编译失败（退出码 $BUILD_EXIT）—— 错误定位"
          echo "----- 日志最后 200 行 -----"
          tail -n 200 build.log
          echo "----- 关键字命中（最后 60 行）-----"
          grep -nE "Error [0-9]|error:|ERROR:|\*\*\*|No rule to make target|No such file" build.log | tail -n 60
          echo "::endgroup::"

          # 7.3-rc5 常见坑的定向提示
          if grep -qiE "backports|wcn36xx|mac80211|cfg80211" build.log; then
            echo "::warning::日志出现 backports/wcn36xx：多半是 openwrt/backports v7.2 与 7.3-rc5 头文件不兼容 —— 见 KERNEL-7.3-rc5-适配说明.md 的 Plan B（改用内核内建 CONFIG_WCN36XX=m）"
          fi
          if grep -qiE "linux-7\.3-rc5|tar\.gz|Hash verification|checksum" build.log; then
            echo "::warning::日志出现内核源码/下载相关报错：确认 dl/linux-7.3-rc5.tar.gz 是否下载完整（rc 包走 git.kernel.org，不走 cdn）"
          fi
          if grep -qiE "is not set|not available in the kernel config" build.log; then
            echo "::warning::有 kmod 因内核配置不可用被跳过：config-7.3 是从 6.18 复制的，7.3 里改名/删除的符号会被 olddefconfig 丢掉"
          fi

          echo "----- 失败的包汇总（本轮全部，而不是只看到第一个）-----"
          grep -oE "ERROR: [^ ]+ failed to build" build.log | sed 's/^ERROR: //' | sort -u | tee build_failed_pkgs.txt
          echo "----- module is missing 汇总 -----"
          grep -oE "ERROR: module '[^']+' is missing" build.log | sort -u | tee -a build_failed_pkgs.txt
          echo "----- 首个真正的编译错误（带上下文）-----"
          grep -nE "error:|fatal error:|No such file or directory|Error [0-9]" build.log | head -n 40
          tail -n 400 build.log > build_tail.txt
          grep -nE "Error [0-9]|error:|ERROR:|\*\*\*|No rule to make target" build.log | tail -n 200 > build_errors.txt

          echo "⚠️ 并行编译失败，切换到详细模式..."
          set +e
          make -j8 V=s -k 2>&1 | tee build_verbose.log
          VERBOSE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $VERBOSE_EXIT -ne 0 ]; then
            echo "::group::❌ 详细模式也失败（退出码 $VERBOSE_EXIT）"
            tail -n 200 build_verbose.log
            echo "::endgroup::"
            grep -oE "ERROR: [^ ]+ failed to build" build_verbose.log | sed 's/^ERROR: //' | sort -u | tee build_failed_pkgs.txt
            grep -oE "ERROR: module '[^']+' is missing" build_verbose.log | sort -u | tee -a build_failed_pkgs.txt
            tail -n 400 build_verbose.log > build_tail.txt
            grep -nE "Error [0-9]|error:|ERROR:|\*\*\*|No rule to make target" build_verbose.log | tail -n 200 > build_errors.txt
            echo "::error::编译失败 —— 看上面的日志尾部，或下载 build-log 工件里的 build_errors.txt"
            exit $VERBOSE_EXIT
          fi
          echo "✅ 详细模式编译成功"
        else
          echo "✅ 并行编译成功"
        fi

        echo "===== 产物目录 ====="
        ls -l bin/targets/*/* 2>/dev/null | head -20 || echo "⚠️ bin/targets 下没有产物"

        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
      shell: bash

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: build-log-${{ matrix.device }}
        path: |
          openwrt/build_tail.txt
          openwrt/build_errors.txt
          openwrt/build_failed_pkgs.txt
        if-no-files-found: ignore

    - name: df -hT
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      # 必须带 steps.compile 成功前置：否则编译失败时会用 "cd: No such file" 把真正的错误盖掉
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Prefix common
      if: steps.organize.outputs.status == 'success'
      run: |
        cd ${{ env.FIRMWARE }}

        if [ "${{ matrix.device }}" != "jz02v10" ]; then
          rm -f config.buildinfo \
                feeds.buildinfo \
                profiles.json \
                sha256sums \
                version.buildinfo
        fi
      shell: bash

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=MSM8916-K73-$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=MSM8916-K73-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        touch release.txt
        if [ "${UPLOAD_GOFILE}" = "true" ] && [ -n "${{ steps.gofile.outputs.url }}" ]; then
          echo "🔗 GoFile" >> release.txt
        fi
        echo "" >> release.txt
        {
        echo "## 高通8916系列 immortalwrt" >> release.txt
        echo "- 编译时间: $(date +"%Y%m%d %H:%M:%S")" >> release.txt
        echo "- 编译机型: ${{ env.ALL_DEVICES }}" >> release.txt
        echo "- 管理地址: 192.168.10.1"
        echo "- 默认用户: root"
        echo "- 默认密码: 空"
        echo "- 源码仓库: ${{ env.REPO_URL }}" >> release.txt
        echo "- 分支: ${{ env.REPO_BRANCH }}" >> release.txt
        echo "- 内核版本: $(grep -h "kmod-usb-core" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F' - ' '{print $2}' | head -1 || echo '未知')"
        echo ""
        echo "### 主要插件"
        echo "#### luci-app 系列"
        grep -h "luci-app-" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /'
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

 
    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false


    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
        
